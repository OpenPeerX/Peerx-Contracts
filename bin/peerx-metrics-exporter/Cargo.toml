[package]
name = "peerx-metrics-exporter"
version = "0.1.0"
edition = "2021"
description = "Prometheus exporter for PeerX cache hit ratio metrics"

[[bin]]
name = "peerx-metrics-exporter"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
warp = "0.3"
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
prometheus = { version = "0.13", features = ["process"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
